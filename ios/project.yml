name: Moody
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 13.2.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 10.1.0

targets:
  Moody:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Moody
        excludes:
          - Info.plist
          - Moody.entitlements
    info:
      path: Moody/Info.plist
    entitlements:
      path: Moody/Moody.entitlements
    settings:
      base:
        PRODUCT_NAME: Moody
        PRODUCT_MODULE_NAME: Moody
        PRODUCT_BUNDLE_IDENTIFIER: com.example.feelingsapp
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-ObjC"
    dependencies:
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: GoogleSignIn
        product: GoogleSignIn

  MoodyTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: MoodyTests
    settings:
      base:
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Moody
